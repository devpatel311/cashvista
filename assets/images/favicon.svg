<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Cashvista favicon">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F3D5C"/>

  <!-- Bar chart bars -->
  <rect x="5"  y="20" width="4" height="8"  rx="1.5" fill="white" opacity="0.7"/>
  <rect x="11" y="15" width="4" height="13" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="17" y="10" width="4" height="18" rx="1.5" fill="white"/>

  <!-- Coral accent arrow -->
  <polyline points="4,22 9,14 15,17 23,7"
            stroke="#F2622E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrow head -->
  <polyline points="18,6 23,7 22,12"
            stroke="#F2622E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
