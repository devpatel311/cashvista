<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="Cashvista logo">
  <!-- ── Icon mark ── -->
  <g>
    <!-- Outer rounded square background -->
    <rect x="0" y="4" width="32" height="32" rx="8" fill="#0F3D5C"/>

    <!-- Bar chart bars (white, ascending left to right) -->
    <rect x="6"  y="22" width="4" height="8"  rx="1.5" fill="white" opacity="0.7"/>
    <rect x="12" y="17" width="4" height="13" rx="1.5" fill="white" opacity="0.85"/>
    <rect x="18" y="12" width="4" height="18" rx="1.5" fill="white"/>

    <!-- Accent arrow (coral) pointing up-right over bars -->
    <polyline points="5,24 10,16 16,19 26,9"
              stroke="#F2622E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arrow head -->
    <polyline points="21,8 26,9 25,14"
              stroke="#F2622E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Cash" in deep teal -->
  <text x="40" y="26"
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="17"
        font-weight="800"
        letter-spacing="-0.4"
        fill="#0F3D5C">Cash</text>
  <!-- "vista" in mint accent -->
  <text x="81" y="26"
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="17"
        font-weight="800"
        letter-spacing="-0.4"
        fill="#00D9A3">vista</text>
</svg>
